name: Build Android APK and AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make Gradle executable
        run: chmod +x ./android/gradlew

      - name: Build Debug APK (For Phone Testing)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Build Release Bundle
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon

      - name: Generate Upload Keystore & Sign AAB
        run: |
          keytool -genkeypair -v \
            -keystore upload.keystore \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass subtrack123 \
            -keypass subtrack123 \
            -dname "CN=SubTrack, OU=Mobile, O=SubTrack, L=Indore, ST=MP, C=IN"

          jarsigner -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore upload.keystore \
            -storepass subtrack123 \
            -keypass subtrack123 \
            android/app/build/outputs/bundle/release/app-release.aab \
            upload

      - name: Upload Test APK
        uses: actions/upload-artifact@v4
        with:
          name: SubTrack-Test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Play Store Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: SubTrack-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
